.group-note { padding: 6px 4px 0; }
.switch { width: 51px; height: 31px; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .2s var(--ease); }
.switch.on { background: var(--success); }
.switch.on::after { transform: translateX(20px); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface-2); font-size: 20px; color: var(--accent-text); cursor: pointer; }
.stepper b { min-width: 34px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 10px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; border-radius: 8px; height: 32px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; padding: 0 10px; }
.seg button[aria-pressed='true'] { background: var(--surface-raised); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* sheet, dialog, toast, keyboard */
.overlay { position: absolute; inset: 0; background: var(--overlay); z-index: 50; animation: fade .2s both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--safe-top) + 10px); z-index: 51; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .24s var(--ease) both; box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
.sheet.short { top: auto; }
.handle { width: 36px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 8px auto 0; }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 4px 8px; min-height: 48px; }
.sheet-head .headline { text-align: center; }
.sheet-head .r { justify-self: end; }
.sheet-body { flex: 1; overflow-y: auto; padding: 8px 20px 16px; scrollbar-width: none; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px 2px; }
.input { display: flex; align-items: center; min-height: 48px; padding: 0 14px; border-radius: 12px; background: var(--surface-2); font-size: 17px; color: var(--text-3); border: 2px solid transparent; }
.input.filled { color: var(--text); }
.input.focus { background: var(--surface); border-color: var(--accent); color: var(--text); }
.input.err { border-color: var(--danger); background: var(--surface); }
.input .caret { display: inline-block; width: 2px; height: 22px; background: var(--accent); margin-left: 1px; animation: blink 1s steps(1) infinite; }
.ferr { color: var(--danger-text); font-size: 13px; margin: 6px 2px 0; font-weight: 500; }
.addrow { display: flex; align-items: center; gap: 10px; min-height: 48px; color: var(--accent-text); font-weight: 600; font-size: 15px; border-top: 1px solid var(--sep); }
.addrow .sugg-wrap { margin-left: auto; display: flex; gap: 6px; overflow: hidden; }
.toggle-row { display: flex; align-items: center; gap: 12px; min-height: 56px; border-top: 1px solid var(--sep); border-bottom: 1px solid var(--sep); }
.toggle-row .main { flex: 1; }
.kbd { height: 291px; background: #d1d3d9; display: grid; grid-template-rows: repeat(4, 1fr); gap: 11px; padding: 10px 4px calc(10px + var(--safe-bottom)); flex: none; }
.screen[data-theme='dark'] .kbd { background: #2b2b2f; }
.kbd div { display: flex; gap: 6px; justify-content: center; }
.kbd span { flex: 0 0 31px; height: 42px; border-radius: 5px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.3); }
.screen[data-theme='dark'] .kbd span { background: #6b6b70; }
.kbd span.w { flex: 0 0 182px; } .kbd span.m { flex: 0 0 42px; background: #abb0ba; }
.dialog { position: absolute; left: 50%; top: 50%; width: calc(100% - 64px); max-width: 320px; transform: translate(-50%, -50%); z-index: 51; background: var(--surface); border-radius: 22px; padding: 22px 20px 16px; text-align: center; animation: pop .2s var(--ease) both; }
.dialog p { margin: 8px 0 18px; font-size: 15px; line-height: 20px; color: var(--text-2); }
.dialog .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: calc(64px + 10px + var(--safe-bottom) + 12px); z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 16px; border-radius: 16px; background: var(--text); color: var(--bg); font-size: 15px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.2); animation: up .2s var(--ease) both; }
.toast .grow { flex: 1; }
.toast button { border: 0; background: transparent; color: #b4abfa; font-weight: 700; font-size: 15px; padding: 8px 10px; cursor: pointer; }
.screen[data-theme='dark'] .toast button { color: var(--accent); }
.toast.in-sheet { bottom: calc(76px + var(--safe-bottom)); }

/* stats */
.herostat { display: flex; align-items: center; gap: 18px; }
.ring { flex: none; position: relative; width: 96px; height: 96px; }
.ring svg { display: block; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.w375 .kpis { grid-template-columns: 1fr 1fr; }
.w375 .kpis .stat:last-child { grid-column: span 2; }
.kpis .stat dd { font-size: 24px; line-height: 28px; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 140px; }
.bars.b30 { grid-template-columns: repeat(30, 1fr); gap: 2px; }
.bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; }
.bars div span { font-size: 12px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.bars i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; background: var(--accent); min-height: 3px; }
.bars.b30 i { border-radius: 2px; }
.bars i.zero { background: var(--surface-2); }
.axis { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; font-size: 12px; color: var(--text-3); font-weight: 600; margin-top: 6px; }
.axis .today { color: var(--accent-text); }
.digest { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.digest div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.digest b { display: block; font-size: 20px; line-height: 24px; }
.digest small { font-size: 12px; color: var(--text-2); font-weight: 500; line-height: 15px; display: block; }
.stagebar { display: flex; gap: 3px; height: 10px; border-radius: 99px; overflow: hidden; margin: 12px 0 10px; }
.stagebar i { display: block; }
.stagelist { margin: 0; padding: 0; list-style: none; }
.stagelist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--sep); font-size: 15px; }
.stagelist li:first-child { border-top: 0; }
.stagelist .grow { flex: 1; }
.stagelist small { display: block; color: var(--text-2); font-size: 12px; }
.sdot { width: 10px; height: 10px; border-radius: 50%; }
.difflist { margin: 6px 0 12px; padding: 0; list-style: none; }
.difflist li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--sep); }
.difflist li:first-child { border-top: 0; }
.difflist .r { color: var(--danger-text); font-size: 13px; font-weight: 600; white-space: nowrap; }

/* skeleton */
.sk { background: var(--surface-2); border-radius: 10px; animation: pulse 1.2s ease-in-out infinite; }

/* empty */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 28px 12px; gap: 8px; }
.empty .ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); margin-bottom: 6px; }

/* lock screen */
.lock { position: absolute; inset: 0; background: radial-gradient(120% 80% at 30% 10%, #4f7cff 0%, #2b1f7a 45%, #0b0b1a 100%); color: #fff; display: flex; flex-direction: column; align-items: center; padding-top: calc(var(--safe-top) + 30px); }
.lock .time { font-size: 82px; font-weight: 600; letter-spacing: -.02em; line-height: 1; margin-top: 6px; }
.notif { margin-top: auto; margin-bottom: 140px; width: calc(100% - 20px); background: rgba(255,255,255,.22); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 20px; padding: 12px 14px; display: flex; gap: 10px; cursor: pointer; text-align: left; border: 0; color: #fff; }
.notif img { width: 38px; height: 38px; border-radius: 9px; }
.notif b { font-size: 15px; } .notif p { margin: 2px 0 0; font-size: 15px; line-height: 19px; white-space: pre-line; }

/* desktop */
.dsk { display: grid; grid-template-columns: 240px 1fr; height: 100%; background: var(--bg); color: var(--text); }
.side { border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.side .brand { margin: 0 8px 22px; }
.side button { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; font-size: 15px; font-weight: 600; color: var(--text-2); cursor: pointer; }
.side button[aria-current='page'] { background: var(--accent-soft); color: var(--accent-text); }
.side .bottom { margin-top: auto; }
.dmain { overflow: hidden; padding: 32px 40px; }
.dgrid { display: grid; grid-template-columns: 7fr 5fr; gap: 24px; max-width: 1000px; }
.split { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
.split .lpane { border-right: 1px solid var(--border); padding: 28px 20px; overflow: hidden; }
.split .rpane { padding: 32px 48px; overflow: hidden; }

/* flow map */
.map { background: var(--page-card); border: 1px solid var(--page-border); border-radius: 20px; padding: 16px; overflow-x: auto; }
.map svg { display: block; min-width: 1100px; }
.map .n rect { fill: var(--page-bg); stroke: var(--page-border); }
.map .n.main rect { fill: #6d5df6; stroke: #6d5df6; }
.map .n text { fill: var(--page-text); font-size: 14px; font-weight: 600; }
.map .n.main text { fill: #fff; }
.map .n .sub { font-size: 11px; font-weight: 500; fill: var(--page-muted); }
.map .n.main .sub { fill: rgba(255,255,255,.8); }
.map .n.new rect { stroke: #6d5df6; stroke-dasharray: 5 4; }
.map path { fill: none; stroke: var(--page-muted); stroke-width: 1.6; }
.map .el { font-size: 11px; fill: var(--page-muted); font-weight: 500; }

/* interactive */
.play { display: grid; grid-template-columns: auto 1fr; gap: 36px; align-items: start; }
.panel { background: var(--page-card); border: 1px solid var(--page-border); border-radius: 20px; padding: 20px; max-width: 520px; position: sticky; top: 80px; }
.panel h3 { margin: 0 0 4px; font-size: 17px; }
.panel .scen { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; }
.panel .scen button { text-align: left; border: 1px solid var(--page-border); background: transparent; border-radius: 12px; padding: 10px 12px; cursor: pointer; font-weight: 600; }
.panel .scen button small { display: block; color: var(--page-muted); font-weight: 500; }
.panel .scen button[aria-pressed='true'] { border-color: #6d5df6; box-shadow: 0 0 0 1px #6d5df6 inset; }
.panel .hint { color: var(--page-muted); font-size: 14px; margin: 0; }
@media (max-width: 900px) { .play { grid-template-columns: 1fr; } .panel { position: static; } }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.96); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 50% { opacity: .55; } }
@keyframes slideout { to { opacity: 0; transform: translateX(-12px); } }
.leaving { animation: slideout .16s var(--ease) forwards; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

const ic = (n, s = 24, extra = '') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${P[n]}</svg>`;
const icF = (n, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };
const CARD = ['карточка', 'карточки', 'карточек'], WORD = ['слово', 'слова', 'слов'];
const wordClass = (t) => t.length <= 18 ? 'w-xl' : t.length <= 40 ? 'w-l' : t.length <= 80 ? 'w-m' : 'w-s';

/* =====================================================================

function nav(active) {
  const items = [['home', 'Главная'], ['cards', 'Карточки'], ['stats', 'Статистика'], ['profile', 'Профиль']];
  return `<div class="navfade"></div><nav class="nav" aria-label="Разделы">${items.map(([k, l]) =>
    `<button data-act="tab" data-v="${k}" ${k === active ? 'aria-current="page"' : ''}>${k === active ? icF(k === 'chart' ? 'chart' : k, 24).replace('fill="currentColor"', k === 'chart' || k === 'cards' || k === 'user' ? 'fill="none"' : 'fill="currentColor" fill-opacity=".18"') : ic(k)}<span>${l}</span></button>`).join('')}</nav>`;
}
function streak(n = 7, pending = true) { return `<span class="streak ${pending ? 'pending' : ''}" title="Серия">${ic('flame', 18)}<span class="num">${n}</span></span>`; }
function toast(text, action, inSheet) { return `<div class="toast ${inSheet ? 'in-sheet' : ''}" role="status"><span class="grow">${text}</span>${action ? `<button data-act="${action[1]}">${action[0]}</button>` : ''}</div>`; }

/* =====================================================================

const S = {};

      <button class="btn btn-primary btn-lg btn-block" data-act="add">${ic('plus', 20)}Добавить слово</button></section>`;

      <button class="btn btn-secondary btn-lg btn-block" data-act="practice">${ic('target', 20)}Тренировка трудных · 7 слов</button>
      <div style="text-align:center;margin-top:6px"><button class="btn btn-tertiary">${ic('refresh', 18)}Проверить снова</button></div></section>`;

      ${prog ? '<p class="foot" style="margin-top:2px">Сегодня уже 23 ответа</p>' : ''}

      ${prog ? '<div class="pbar" role="progressbar" aria-valuenow="85"><i style="width:85%"></i></div>' : ''}
      <button class="btn btn-primary btn-lg btn-block" data-act="start">${prog ? 'Продолжить' : 'Начать повторение'}${ic('arrow', 20)}</button>
      ${v === 'limit' ? '<p class="foot" style="margin-top:12px">Ещё 6 новых карточек появятся в следующие дни — дневной лимит.</p>' : ''}</section>`;
  }
  const tiles = `<div class="tiles">
    <button class="tile warm" data-act="practice"><span class="ic">${ic('target', 22)}</span><span><b>Трудные слова</b><small>7 слов · тренировка</small></span></button>
    <button class="tile" data-act="add"><span class="ic">${ic('plus', 22)}</span><span><b>Добавить слово</b><small>в коллекцию</small></span></button></div>`;
  const max = Math.max(...WEEK);

    <div class="minibars">${WEEK.map((n) => `<i class="${n ? '' : 'zero'}" style="height:${n ? Math.max(8, n / max * 100) : 0}%"></i>`).join('')}</div>
    <div class="minidays">${DAYS.map((d, i) => `<span class="${i === 6 ? 'today' : ''}">${d}</span>`).join('')}</div>
    <p class="foot" style="margin-top:10px">40 ответов · 6 из 7 дней с занятиями</p></section>`;
  return `<div class="scroll stack">${head}${hero}${tiles}${week}</div>${nav('home')}${s.toast ? toast(s.toast, null) : ''}`;

S.session = (s = {}) => {
  const practice = !!s.practice;
  const total = s.total || (practice ? 7 : 12);
  const i = s.i || 0;
  const w = s.long ? LONG : (practice ? WORDS[[6, 10, 1, 0, 7, 2, 3][i % 7]] : WORDS[i % WORDS.length]);
  const pos = Math.min(i + 1, total);
  const ph = s.phase || 'front';
  const head = `<div class="sess-head"><button class="iconbtn" data-act="exit" aria-label="${practice ? 'Завершить тренировку' : 'Завершить повторение'}">${ic('close', 24)}</button>
    <div class="track" role="progressbar" aria-valuenow="${i}" aria-valuemax="${total}"><i style="width:${i / total * 100}%"></i></div><span class="sess-count">${pos} / ${total}</span></div>`;
  if (ph === 'finish') {
    const body = practice
      ? `<div class="finish"><div class="brandmark">${ic('target', 30)}</div><div class="overline" style="color:var(--accent-text)">Тренировка трудных слов</div><h1 class="title1">Тренировка завершена</h1>
        <div class="statrow" style="grid-template-columns:repeat(3,1fr)"><dl class="stat" style="margin:0"><dt>Повторено</dt><dd class="num">7</dd></dl><dl class="stat" style="margin:0"><dt>Помню</dt><dd class="num">4</dd></dl><dl class="stat" style="margin:0"><dt>С ошибкой</dt><dd class="num">3</dd></dl></div>
        <p class="foot">Расписание повторений не изменилось.</p></div>
        <div class="dock" style="display:grid;gap:8px"><button class="btn btn-primary btn-lg btn-block" data-act="practice">Повторить слова с ошибками · 3</button><button class="btn btn-tertiary btn-block" data-act="exit">К трудным словам</button></div>`
      : `<div class="finish"><div class="brandmark">${ic('check', 32)}</div><h1 class="title1">Готово!</h1><p class="callout">Очередь на сегодня пройдена.</p>
        <div class="statrow"><dl class="stat" style="margin:0"><dt>Повторено</dt><dd class="num">${total}<small>${plural(total, CARD)}</small></dd></dl><dl class="stat" style="margin:0"><dt>Из них новых</dt><dd class="num">${total >= 12 ? 5 : 1}</dd></dl></div></div>
        <div class="dock" style="display:grid;gap:8px"><button class="btn btn-secondary btn-lg btn-block" data-act="practice">${ic('target', 20)}Тренировка трудных · 7 слов</button><button class="btn btn-primary btn-lg btn-block" data-act="exit">На главную</button></div>`;
    return `<div class="sess">${head.replace(/<span class="sess-count">.*?<\/span>/, `<span class="sess-count">${total} / ${total}</span>`).replace(/width:[\d.]+%/, 'width:100%')}${body}</div>`;
  }
  if (ph === 'empty') {
    return `<div class="sess">${head.replace(/<div class="track".*?<\/div><span class="sess-count">.*?<\/span>/, '<div style="flex:1"></div>')}<div class="finish"><div class="done-mark" style="width:64px;height:64px">${ic('check', 30)}</div><h1 class="title1">Сегодня всё повторено</h1>
      <p class="callout">Новых карточек к повторению нет. Возвращайся, когда подойдёт срок.</p></div><div class="dock"><button class="btn btn-primary btn-lg btn-block" data-act="exit">На главную</button></div></div>`;
  }
  const badge = practice ? `<span class="badge danger">забыто ${w.lapses || 3} ${plural(w.lapses || 3, ['раз', 'раза', 'раз'])}</span>` : (w.st === 'new' ? '<span class="badge accent">Новое слово</span>' : '');
  const revealed = ph !== 'front';
  const answer = revealed ? `<div class="answer"><div class="hair"></div><div class="translation">${esc(w.ru)}</div>
    ${w.ex ? `<div class="inset"><div class="overline">Пример</div><p class="es" lang="es">${esc(w.ex)}</p></div>` : ''}
    ${w.memo ? `<div class="inset"><div class="overline">Моя заметка</div><p>${esc(w.memo)}</p></div>` : ''}</div>` : '';
  // Owner's decision (D-06): three grades in both the FSRS session and practice.
  const grades = [['again', 'Не помню'], ['hard', 'С трудом'], ['good', 'Помню']];
  const dock = revealed
    ? `<div class="dock">${ph === 'error' ? `<div class="banner error" role="alert">${ic('info', 20)}<span class="grow">Ответ не сохранён. Попробуй ещё раз.</span></div>` : ''}
      <div class="ratings" style="--n:${grades.length}">${grades.map(([g, l], k) => `<button class="rating r-${g} ${s.pressed === g ? 'pressed' : ''}" data-act="rate" data-v="${g}" aria-label="${l}${practice ? '' : '. Следующий показ: ' + INTERVALS[k]}"><b>${l}</b>${practice ? '' : `<small>${INTERVALS[k]}</small>`}</button>`).join('')}</div></div>`
    : `<div class="dock"><button class="btn btn-primary btn-lg btn-block" data-act="reveal">Показать ответ</button></div>`;
  return `<div class="sess">${head}${practice ? '<div class="overline sess-tag">Тренировка · расписание не меняется</div>' : ''}
    <div class="sess-body"><div class="word-zone" data-act="${revealed ? '' : 'reveal'}" style="${practice ? 'padding-top:24px' : ''}">${badge}<p class="word ${wordClass(w.es)}" lang="es">${esc(w.es)}</p></div>${answer}</div>${dock}</div>`;
};

function rowHtml(w, idx, sel) {
  const map = { due: ['повторить', 'var(--accent)'], learning: ['изучается', 'var(--warning)'], new: ['новое', 'var(--info)'], review: [`через ${w.next}`, 'transparent'] };
  const [label, color] = map[w.st];
  return `<div class="row ${sel ? 'sel' : ''}" data-act="open" data-v="${idx}" role="button" tabindex="0"><div class="main"><div class="t" lang="es">${esc(w.es)}</div><div class="s">${esc(w.ru)}</div></div>
    <div class="end"><span>${color !== 'transparent' ? `<i class="dot" style="background:${color}"></i>` : ''}${label}</span>${w.rev ? `<span title="Есть обратная карточка">${ic('swap', 16)}</span>` : ''}</div></div>`;
}

S.cards = (s = {}) => {
  const f = s.filter || 'all';
  const filters = [['all', 'Все', 41], ['due', 'К повторению', 7], ['new', 'Новые', 5], ['learning', 'Изучаются', 4], ['difficult', 'Трудные', 7], ['archived', 'Архив', 2]];
  let list = WORDS.map((w, k) => [w, k]);
  if (f === 'difficult') list = list.filter(([w]) => w.lapses > 0);
  if (f === 'due') list = list.filter(([w]) => w.st === 'due' || w.st === 'learning');
  if (f === 'new') list = list.filter(([w]) => w.st === 'new');
  if (f === 'learning') list = list.filter(([w]) => w.st === 'learning');
  const q = s.query || '';
  const none = f === 'none';
  if (s.variant === 'loading') return `<div class="scroll"><div class="sk" style="width:150px;height:32px;margin-top:8px"></div><div class="sk" style="height:44px;margin-top:20px"></div><div class="sk" style="height:34px;margin-top:12px;width:85%"></div><div class="list" style="margin-top:16px">${'<div class="row"><div class="main"><div class="sk" style="width:55%;height:16px"></div><div class="sk" style="width:40%;height:13px;margin-top:8px"></div></div></div>'.repeat(6)}</div></div>${nav('cards')}`;
  const header = `<div class="screenhead"><div class="screenhead-row"><h1 class="title1">Карточки</h1><button class="iconbtn filled" data-act="add" aria-label="Добавить слово">${ic('plus', 22)}</button></div><p class="foot" style="margin-top:2px">41 слово · 48 карточек</p></div>`;
  const controls = `<div class="search">${ic('search', 20)}<span class="${q || none ? 'q' : ''}">${none ? 'fianzas' : q || 'Поиск: слово, перевод, пример'}</span>${none ? ic('close', 18) : ''}</div>
    <div class="chips" role="group" aria-label="Состояние">${filters.map(([k, l, n]) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${k === (none ? 'all' : f)}">${l} <small>${n}</small></button>`).join('')}</div>
    <div class="toolrow"><button class="chip ghost" data-act="tags">${ic('tag', 16)}Теги</button><button class="chip ghost">${ic('sort', 16)}Сначала новые</button><span class="foot">${none ? '0' : f === 'all' ? '41' : list.length} из 41</span></div>`;
  let body;
  if (s.variant === 'empty') {
    body = `<div class="empty card"><div class="ic">${ic('cards', 28)}</div><h2 class="headline">Здесь будут твои слова</h2><p class="callout">Добавь первое слово — оно сразу появится в очереди на Главной.</p><button class="btn btn-primary" data-act="add" style="margin-top:8px">${ic('plus', 20)}Добавить слово</button></div>`;
    return `<div class="scroll stack">${header}${body}</div>${nav('cards')}`;
  }
  if (none) body = `<div class="empty"><div class="ic">${ic('search', 28)}</div><h2 class="headline">Ничего не найдено</h2><p class="callout">По запросу «fianzas» слов нет. Поиск не учитывает ударения.</p><button class="btn btn-secondary" style="margin-top:8px" data-act="filter" data-v="all">Сбросить фильтры</button></div>`;
  else body = (f === 'difficult' ? `<div class="banner info" style="margin:0 0 12px">${ic('target', 20)}<span class="grow"><b>Тренировка · 8 карточек</b><br><span style="opacity:.85">Расписание повторений не меняется.</span></span><button class="btn btn-primary" data-act="practice">Начать</button></div>` : '')
    + `<div class="list">${list.map(([w, k]) => rowHtml(w, k, s.sel === k)).join('')}</div>`;
  const sheet = s.sheet === 'tags' ? `<div class="overlay" data-act="close"></div><div class="sheet short" role="dialog" aria-label="Теги"><div class="handle"></div><div class="sheet-head"><button class="btn btn-tertiary" data-act="close">Сбросить</button><h2 class="headline">Теги</h2><button class="btn btn-tertiary r" data-act="close">Готово</button></div>
    <div class="sheet-body" style="padding-bottom:calc(20px + var(--safe-bottom))"><div class="list">${[['документы', 8, true], ['глаголы', 6], ['жильё', 6], ['связки', 4], ['выражения', 3], ['основа', 1], ['фразы', 1]].map(([t, n, on]) => `<div class="row" style="min-height:52px"><div class="main"><div class="t" style="font-weight:500">#${t}</div></div><span class="val">${n}</span>${on ? `<span style="color:var(--accent-text)">${ic('check', 22)}</span>` : '<span style="width:22px"></span>'}</div>`).join('')}</div></div></div>` : '';
  return `<div class="scroll stack">${header}${controls}${body}</div>${nav('cards')}${sheet}${s.toast ? toast(s.toast, ['Вернуть', 'undo']) : ''}`;
};

function keyboard() {
  const row = (n, m) => `<div>${m ? '<span class="m"></span>' : ''}${'<span></span>'.repeat(n)}${m ? '<span class="m"></span>' : ''}</div>`;
  return `<div class="kbd" aria-hidden="true">${row(10)}${row(9)}${row(7, true)}<div><span class="m" style="flex-basis:86px"></span><span class="w"></span><span class="m" style="flex-basis:86px;background:var(--accent)"></span></div></div>`;
}

S.add = (s = {}) => {
  const v = s.variant || 'empty';
  const under = S.cards({});
  const edit = v === 'edit';
  const filled = v !== 'empty';
  const f1 = edit ? 'la ventanilla' : v === 'dup' ? 'la práctica' : filled && v !== 'error' ? 'la nevera' : '';
  const f2 = edit ? 'окошко (в учреждении)' : v === 'dup' ? 'практика' : v === 'filled' || v === 'saved' ? 'холодильник' : '';
  const kb = v === 'empty' || v === 'filled' || v === 'error';
  const saved = v === 'saved';
  const field1 = `<div class="field"><label>Слово или фраза</label><div class="input ${v === 'empty' || saved ? 'focus' : f1 ? 'filled' : ''} ${v === 'error' ? 'err' : ''}" lang="es">${saved ? '' : f1 ? esc(f1) : '<span style="color:var(--text-3)">например, la práctica</span>'}${v === 'empty' || saved ? '<span class="caret"></span>' : ''}</div>${v === 'error' ? '<p class="ferr">Введи слово или фразу.</p>' : ''}</div>`;
  const field2 = `<div class="field"><label>Перевод</label><div class="input ${v === 'filled' ? 'focus' : f2 && !saved ? 'filled' : ''} ${v === 'error' ? 'err' : ''}">${saved ? '<span style="color:var(--text-3)">например, практика</span>' : f2 ? esc(f2) : '<span style="color:var(--text-3)">например, практика</span>'}${v === 'filled' ? '<span class="caret"></span>' : ''}</div>${v === 'error' ? '<p class="ferr">Введи перевод.</p>' : ''}</div>`;
  const extras = edit
    ? `<div class="field"><label>Пример</label><div class="input filled" style="min-height:72px;align-items:flex-start;padding-top:12px" lang="es">Pregunte en la ventanilla número tres.</div></div>
       <div class="field"><label>Личная заметка</label><div class="input filled">как «вентиляция» — маленькое окно</div></div>
       <div class="field"><label>Теги</label><div class="chips" style="margin:0;padding:0;-webkit-mask-image:none;mask-image:none"><span class="chip" aria-pressed="true">#документы ✕</span><span class="chip sugg">+ глаголы</span><span class="chip sugg">+ жильё</span></div></div>`
    : `<div class="addrow">${ic('plus', 20)}Пример</div><div class="addrow">${ic('plus', 20)}Личная заметка</div>
       <div class="addrow">${ic('plus', 20)}Теги<span class="sugg-wrap"><span class="chip sugg">+ жильё</span><span class="chip sugg">+ документы</span></span></div>
       <div class="toggle-row"><div class="main"><div style="font-size:17px">Обратная карточка</div><div class="foot">перевод → слово, своё расписание</div></div><span class="switch"></span></div>`;
  const dup = v === 'dup' ? `<div class="banner warning" role="alert" style="flex-direction:column;align-items:stretch;margin-top:14px"><div style="display:flex;gap:10px">${ic('info', 20)}<span>Похожее слово уже есть: <b lang="es">la práctica</b> — практика</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px"><button class="btn btn-primary">Всё равно добавить</button><button class="btn btn-secondary">Открыть</button><button class="btn btn-tertiary">Исправить</button></div></div>` : '';
  const dockBtn = v === 'dup' ? '' : `<div class="dock" style="padding-bottom:${kb ? '10px' : 'calc(12px + var(--safe-bottom))'}"><button class="btn btn-primary btn-lg btn-block" data-act="save">${edit ? 'Сохранить' : 'Добавить'}</button></div>`;
  return `${under}<div class="overlay"></div><div class="sheet" role="dialog" aria-label="${edit ? 'Изменить слово' : 'Новое слово'}"><div class="handle"></div>
    <div class="sheet-head"><button class="btn btn-tertiary" data-act="close">Отмена</button><h2 class="headline">${edit ? 'Изменить слово' : 'Новое слово'}</h2><span class="r">${edit ? '' : '<button class="btn btn-tertiary" data-act="close">Готово</button>'}</span></div>
    <div class="sheet-body">${field1}${field2}${extras}${dup}</div>${dockBtn}${kb ? keyboard() : ''}
    ${saved ? toast('Добавлено: <b lang="es">la nevera</b>', ['Открыть', 'open0'], true) : ''}</div>`;
};

S.detail = (s = {}) => {
  const w = WORDS[s.i ?? 1];

    <h1 class="title1" lang="es" style="margin-top:10px">${esc(w.es)}</h1><p class="title2 muted" style="font-weight:500;margin-top:4px">${esc(w.ru)}</p>

    <div class="overline group-title">Обучение</div>
    <div class="list"><div class="row" style="cursor:default"><div class="main">Статус</div><span class="badge ${w.st === 'due' ? 'accent' : w.st === 'learning' ? 'warning' : w.st === 'new' ? '' : 'success'}">${stLabel}</span></div>

    <div class="row" style="cursor:default"><div class="main">Обратная карточка</div><span class="val">${w.rev ? 'есть · через 12 дн' : 'нет'}</span></div>
    <div class="row" style="cursor:default"><div class="main">Добавлено</div><span class="val">${w.added}</span></div></div>
    <button class="btn btn-destructive btn-block" style="margin-top:22px" data-act="archive">${ic('archive', 20)}В архив</button></div>${nav('cards')}${dialog}`;
};

S.stats = (s = {}) => {
  const empty = s.variant === 'empty';
  const p = s.period || 7;
  const data = p === 7 ? WEEK : MONTH;
  const max = Math.max(...data, 1);
  const r = 40, c = 2 * Math.PI * r, frac = empty ? 0 : 32 / 41;
  const ring = `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="${r}" stroke="var(--surface-2)" stroke-width="9" fill="none"/><circle cx="48" cy="48" r="${r}" stroke="var(--accent)" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="${c * frac} ${c}"/></svg><b class="num">${empty ? '0' : '78%'}</b></div>`;
  const head = `<div class="screenhead"><h1 class="title1">Статистика</h1></div>`;
  const hero = `<section class="hero herostat">${ring}<div><div class="overline">Изучено слов</div><div style="margin-top:4px"><span class="num" style="font-size:28px;font-weight:700">${empty ? 0 : 32}</span> <span class="callout" style="display:inline">из ${empty ? 0 : 41} ${empty ? 'слов' : 'слова'}</span></div><p class="foot" style="margin-top:4px">все карточки слова на длинных интервалах ${ic('info', 14, 'style="vertical-align:-2px"')}</p></div></section>`;
  const kpis = `<dl class="kpis" style="margin:0"><div class="stat"><dt>Точность</dt><dd class="num">${empty ? '—' : '86%'}</dd><div class="det">${empty ? 'пока нет ответов' : 'из 216 ответов'}</div></div>
    <div class="stat"><dt>Серия</dt><dd class="num">${empty ? 0 : 7}<small>${empty ? 'дней' : 'дней'}</small></dd><div class="det">${empty ? 'с первого ответа' : 'рекорд 9'}</div></div>
    <div class="stat"><dt>В очереди</dt><dd class="num">${empty ? 0 : 12}</dd><div class="det">${empty ? '—' : 'на сегодня'}</div></div></dl>`;
  if (empty) return `<div class="scroll stack">${head}${hero}${kpis}<div class="empty card"><div class="ic">${ic('chart', 28)}</div><h2 class="headline">Пока нет статистики</h2><p class="callout">Добавь слова и пройди первое повторение — здесь появится твой прогресс.</p><button class="btn btn-primary" data-act="add" style="margin-top:8px">${ic('plus', 20)}Добавить слово</button></div></div>${nav('stats')}`;
  const bars = `<div class="bars ${p === 30 ? 'b30' : ''}">${data.map((n, k) => `<div>${p === 7 ? `<span>${n}</span>` : ''}<i class="${n ? '' : 'zero'}" style="height:${n ? n / max * (p === 7 ? 82 : 100) : 3}%"></i></div>`).join('')}</div>
    ${p === 7 ? `<div class="axis">${DAYS.map((d, k) => `<span class="${k === 6 ? 'today' : ''}">${d}</span>`).join('')}</div>` : '<div class="axis" style="grid-template-columns:1fr 1fr 1fr"><span style="text-align:left">16 окт</span><span>30 окт</span><span style="text-align:right">сегодня</span></div>'}`;
  const act = `<section class="card"><div class="cardhead"><h2 class="headline">Активность</h2><div class="seg" role="group"><button data-act="period" data-v="7" aria-pressed="${p === 7}">7 дней</button><button data-act="period" data-v="30" aria-pressed="${p === 30}">30 дней</button></div></div>${bars}
    <div class="digest"><div><b class="num">${p === 7 ? 40 : 174}</b><small>ответов</small></div><div><b class="num">${p === 7 ? '6' : '26'}<span class="muted" style="font-size:13px"> из ${p}</span></b><small>дней с занятиями</small></div><div><b class="num">${p === 7 ? '6,7' : '6,7'}</b><small>в день занятий</small></div></div>
    <button class="link" style="margin-top:6px">${ic('chev', 16)}По дням</button></section>`;
  const stages = `<section class="card"><h2 class="headline">Карточки по стадиям</h2><div class="stagebar"><i style="flex:5;background:var(--stage-new)"></i><i style="flex:4;background:var(--stage-learning)"></i><i style="flex:39;background:var(--stage-learned)"></i></div>
    <ul class="stagelist"><li><span class="sdot" style="background:var(--stage-new)"></span><span class="grow">Новые<small>ещё не показывались</small></span><b class="num">5</b><span class="muted">10%</span></li>
    <li><span class="sdot" style="background:var(--stage-learning)"></span><span class="grow">Изучаются<small>первые шаги или после ошибки</small></span><b class="num">4</b><span class="muted">8%</span></li>
    <li><span class="sdot" style="background:var(--stage-learned)"></span><span class="grow">На длинных интервалах<small>прошли шаги изучения</small></span><b class="num">39</b><span class="muted">81%</span></li></ul></section>`;
  const diff = `<section class="card"><div class="cardhead"><h2 class="headline">Трудные слова</h2><span class="badge count danger num">7</span></div>
    <ol class="difflist">${[['la práctica', 'практика', 5], ['ponerse de acuerdo', 'договориться', 4], ['la ventanilla', 'окошко', 2]].map(([e, rr, n]) => `<li><span><b lang="es">${e}</b><br><span class="muted" style="font-size:14px">${rr}</span></span><span class="r">забыто ${n} ${plural(n, ['раз', 'раза', 'раз'])}</span></li>`).join('')}</ol>
    <div style="display:flex;gap:8px"><button class="btn btn-secondary" style="flex:1" data-act="practice">${ic('target', 18)}Тренировка</button><button class="btn btn-tertiary" data-act="filter" data-v="difficult">Все 7${ic('chev', 18)}</button></div></section>`;
  return `<div class="scroll stack">${head}${hero}${kpis}${act}${stages}${diff}</div>${nav('stats')}`;
};

    <div class="overline group-title">Данные</div><div class="list">${row(`${ic('download', 20, 'style="vertical-align:-4px;margin-right:8px;color:var(--accent-text)"')}Экспорт резервной копии`, `<span class="chev">${ic('chev', 18)}</span>`)}${row(`${ic('upload', 20, 'style="vertical-align:-4px;margin-right:8px;color:var(--accent-text)"')}Восстановить из копии`, `<span class="chev">${ic('chev', 18)}</span>`)}${row(`${ic('cards', 20, 'style="vertical-align:-4px;margin-right:8px;color:var(--accent-text)"')}Импорт из Anki (.apkg)`, `<span class="chev">${ic('chev', 18)}</span>`)}</div>
    <p class="foot group-note">Резервная копия — один файл со всеми словами и историей повторений.</p>
    <div class="overline group-title">О приложении</div><div class="list">${row(`<span style="display:flex;align-items:center;gap:10px"><img src="${LOGO}" alt="" width="28" height="28" style="border-radius:7px">ALSAVI · изучение испанского</span>`, '')}</div></div>${nav('profile')}`;
};

/* =====================================================================

   ===================================================================== */
const DEV = { se: [375, 667], 375: [375, 812], 390: [390, 844], 430: [430, 932] };
let state = { mode: 'gallery', theme: 'light', dev: '390', zoom: '.74' };
function phone(inner, id = '') {
  const [w, h] = DEV[state.dev];
  const se = state.dev === 'se';
  const narrow = w < 390 ? 'w375' : '';
  return `<div class="zoom" style="--w:${w};--h:${h}"><div class="phone ${se ? 'se' : ''}"><div class="screen ${narrow}" data-theme="${state.theme}" ${id ? `id="${id}"` : ''}>
    <div class="island"></div><div class="sbar"><span>9:41</span><span class="sbar-r"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><i></i></span></div>
    <div class="screen-inner" style="position:absolute;inset:0">${inner}</div><div class="homeind"></div></div></div></div>`;
}
function frame(label, note, inner) {
  const [w] = DEV[state.dev];

function renderGallery() {
  let html = `<p class="intro">Прототип следующей версии ALSAVI (проектный материал, не рабочее приложение). Данные — пример коллекции. Переключатели вверху меняют тему и размер устройства для всех экранов. Спецификации — <code>docs/ui-ux/SCREEN_SPECIFICATIONS.md</code>.</p>`;
  for (const sec of GALLERY) html += `<section class="sec"><h2>${sec.t}</h2><p>${sec.p}</p><div class="frames">${sec.f.map(([l, n, inner]) => frame(l, n, inner)).join('')}</div></section>`;
  html += `<section class="sec"><h2>10. Компьютер (1280 × 800)</h2><p>Не растянутый телефон: боковая навигация, две колонки на Главной, «Карточки» — список + просмотр (мастер-деталь). Масштаб 50 %.</p>

  return html;
}

let play = { scen: 'daily', screen: 'home', s: { variant: 'start' } };
function renderPlayScreen() { return S[play.screen](play.s); }
function renderPlay() {
  const cur = SCEN.find((x) => x[0] === play.scen);
  return `<div class="play"><div id="playPhone">${phone(renderPlayScreen(), 'playScreen')}</div>
    <aside class="panel"><h3>Интерактивный прототип</h3><p class="hint">Нажимай кнопки в телефоне — основные переходы работают. Сценарии из USER_FLOWS.md:</p>
    <div class="scen">${SCEN.map(([k, l, d]) => `<button data-scen="${k}" aria-pressed="${k === play.scen}">${l}<small>${d}</small></button>`).join('')}</div>
    <p class="hint">Сейчас: <b>${cur ? cur[1] : ''}</b>. На компьютере в настоящем приложении работают и клавиши: Пробел — показать ответ, 1–3 — оценка.</p></aside></div>`;
}
function rerenderPlay() {
  const host = document.getElementById('playScreen');
  if (host) host.querySelector('.screen-inner').innerHTML = renderPlayScreen();
}
const ACT = {
  tab(v) { play.screen = v; play.s = v === 'home' ? { variant: play.done ? 'done' : 'start' } : {}; },
  start() { play.screen = 'session'; play.s = { phase: 'front', i: 0, total: 4 }; },
  reveal() { if (play.screen === 'session') play.s = { ...play.s, phase: 'revealed' }; },
  rate(v) {
    const total = play.s.total || 4;
    const host = document.querySelector('#playScreen .word-zone');
    const next = () => { const i = (play.s.i || 0) + 1; play.s = i >= total ? { ...play.s, phase: 'finish' } : { ...play.s, i, phase: 'front', pressed: null }; if (!play.s.practice && play.s.phase === 'finish') play.done = true; rerenderPlay(); };
    play.s = { ...play.s, pressed: v }; rerenderPlay();
    setTimeout(() => { const z = document.querySelector('#playScreen .sess-body'); if (z) z.classList.add('leaving'); setTimeout(next, 160); }, 100);
    return 'async';
  },
  exit() { if (play.s.practice) { play.screen = 'cards'; play.s = { filter: 'difficult' }; } else { play.screen = 'home'; play.s = { variant: play.done ? 'done' : 'progress' }; } },
  practice() { play.screen = 'session'; play.s = { practice: true, phase: 'front', i: 0, total: 4 }; },
  add() { play.back = { screen: play.screen, s: play.s }; play.screen = 'add'; play.s = { variant: 'empty' }; },
  save() { if (play.s.variant === 'edit') { play.screen = 'detail'; play.s = { i: 1 }; return; } play.s = { variant: 'saved' }; },
  close() { if (play.screen === 'add') { const b = play.back || { screen: 'cards', s: {} }; play.screen = b.screen === 'add' ? 'cards' : b.screen; play.s = b.s; } else if (play.screen === 'detail') { play.s = { ...play.s, dialog: false }; } else { play.s = { ...play.s, sheet: null }; } },
  open(v) { play.screen = 'detail'; play.s = { i: Number(v) }; },
  open0() { play.screen = 'detail'; play.s = { i: 3 }; },
  edit() { play.back = { screen: 'detail', s: { i: play.s.i } }; play.screen = 'add'; play.s = { variant: 'edit' }; },
  archive() { play.s = { ...play.s, dialog: true }; },
  archived() { play.screen = 'cards'; play.s = { toast: `<b lang="es">${esc(WORDS[1].es)}</b> в архиве` }; },
  undo() { play.s = { ...play.s, toast: null }; },
  filter(v) { play.screen = 'cards'; play.s = { filter: v }; },
  tags() { play.s = { ...play.s, sheet: 'tags' }; },
  period(v) { play.s = { ...play.s, period: Number(v) }; },
  'push-open'() { play.screen = 'session'; play.s = { phase: 'front', i: 0, total: 4 }; },
};

/* =====================================================================
   App shell
   ===================================================================== */
const root = document.getElementById('root');
function render() {
  document.documentElement.dataset.page = state.theme;
  document.documentElement.style.setProperty('--z', state.zoom);
  root.innerHTML = state.mode === 'gallery' ? renderGallery() : state.mode === 'play' ? renderPlay() : renderMap();
}
function setGroup(id, attr, val) { document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset[attr] === val))); }
document.querySelector('.tb').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { state.mode = b.dataset.mode; setGroup('modeG', 'mode', state.mode); }
  if (b.dataset.theme) { state.theme = b.dataset.theme; setGroup('themeG', 'theme', state.theme); }
  if (b.dataset.dev) { state.dev = b.dataset.dev; setGroup('devG', 'dev', state.dev); }
  if (b.dataset.zoom) { state.zoom = b.dataset.zoom; setGroup('zoomG', 'zoom', state.zoom); }
  render();
});
root.addEventListener('click', (e) => {
  const sc = e.target.closest('[data-scen]');
  if (sc) { const x = SCEN.find((q) => q[0] === sc.dataset.scen); play = { scen: x[0], screen: x[3].screen, s: { ...x[3].s } }; render(); return; }
  if (state.mode !== 'play') return;
  const el = e.target.closest('[data-act]'); if (!el || !el.closest('#playScreen')) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  const r = fn(el.dataset.v); if (r !== 'async') rerenderPlay();
});
render();
